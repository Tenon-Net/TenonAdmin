name: backend-ci

# 后端 CI(设计 §8):push / PR 触发 build + test。仅在改到 backend 时跑。
on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 数据库矩阵(设计 §8「至少 SQLite + MySQL」)。fail-fast=false:一条腿红不掩盖另一条。
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    # MySQL 服务容器(两条腿都起,sqlite 腿忽略之;成本低、免去条件 service 的写法复杂度)。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.config 已 clear 到 nuget.org(消除私有源依赖),外部贡献者可直接还原
      - name: Restore
        run: dotnet restore backend/TenonAdmin.slnx

      - name: Build
        run: dotnet build backend/TenonAdmin.slnx -c Release --no-restore

      # 单元 + 集成测试(WebApplicationFactory)。DB 由环境变量选择(见 tests/TestDb.cs):
      #   sqlite 腿 → 各测试独立临时 .db 文件;mysql 腿 → 各测试独立库(按 DbPath 派生,自动建/删)。
      #   含 §8 可替换性六件套 + 数据范围 + 认证/授权/限流回归。
      - name: Test (${{ matrix.db }})
        env:
          TENON_TEST_DBTYPE: ${{ matrix.db == 'mysql' && 'MySql' || 'Sqlite' }}
          TENON_TEST_MYSQL: ${{ matrix.db == 'mysql' && 'Server=127.0.0.1;Port=3306;User ID=root;Password=root;AllowPublicKeyRetrieval=true;SSL Mode=None;' || '' }}
        run: dotnet test backend/TenonAdmin.slnx -c Release --no-build
