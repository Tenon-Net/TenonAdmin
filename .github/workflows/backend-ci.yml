name: backend-ci

# 后端 CI(设计 §8):push / PR 触发 build + test。仅在改到 backend 时跑。
on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 数据库矩阵(设计 §8「至少 SQLite + MySQL」,这里再加 SqlServer)。fail-fast=false:一条腿红不掩盖其它。
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, sqlserver, postgres]

    # 服务容器(所有腿都起,用不到的腿忽略之;成本低、免去条件 service 的写法复杂度)。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # SqlServer:不给 health-cmd —— 2022 镜像默认不带 sqlcmd,健康探针会挂;就绪由下方专门的等待步骤保证。
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Tenon_Ci_2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
      # PostgreSQL:官方镜像自带 pg_isready,健康探针直接用,无需额外等待步骤。
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.config 已 clear 到 nuget.org(消除私有源依赖),外部贡献者可直接还原
      - name: Restore
        run: dotnet restore backend/TenonAdmin.slnx

      - name: Build
        run: dotnet build backend/TenonAdmin.slnx -c Release --no-restore

      # 等 SqlServer 可登录(仅 sqlserver 腿)。端口先开、随后才接受登录,故用真实登录轮询,
      # 不依赖 DB 镜像/宿主是否装了 sqlcmd:借官方 mssql-tools 镜像 + --network host 连宿主 :1433。
      - name: Wait for SQL Server ready
        if: matrix.db == 'sqlserver'
        run: |
          for i in $(seq 1 40); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
                 /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P 'Tenon_Ci_2026' -Q 'SELECT 1' -b >/dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            echo "waiting for SQL Server... ($i/40)"; sleep 3
          done
          echo "SQL Server did not become ready in time"; exit 1

      # 单元 + 集成测试(WebApplicationFactory)。DB 由环境变量选择(见 tests/TestDb.cs):
      #   sqlite 腿 → 各测试独立临时 .db 文件;mysql/sqlserver 腿 → 各测试独立库(按 DbPath 派生,自动建/删)。
      #   含 §8 可替换性六件套 + 数据范围 + 认证/授权/限流回归。
      - name: Test (${{ matrix.db }})
        env:
          TENON_TEST_DBTYPE: ${{ matrix.db == 'mysql' && 'MySql' || matrix.db == 'sqlserver' && 'SqlServer' || matrix.db == 'postgres' && 'PostgreSQL' || 'Sqlite' }}
          TENON_TEST_MYSQL: ${{ matrix.db == 'mysql' && 'Server=127.0.0.1;Port=3306;User ID=root;Password=root;AllowPublicKeyRetrieval=true;SSL Mode=None;' || '' }}
          # SqlServer 连接串带 TrustServerCertificate/Encrypt=False:MDS 5.x 默认加密且 CI 无受信证书。基础串不含 Database,TestDb 建隔离库时再补。
          TENON_TEST_SQLSERVER: ${{ matrix.db == 'sqlserver' && 'Server=127.0.0.1;User ID=sa;Password=Tenon_Ci_2026;TrustServerCertificate=True;Encrypt=False;' || '' }}
          # PostgreSQL 基础串不含 Database(连维护库 postgres 建隔离库,TestDb 建库后再补 Database)。
          TENON_TEST_POSTGRESQL: ${{ matrix.db == 'postgres' && 'Server=127.0.0.1;Port=5432;User ID=postgres;Password=postgres;' || '' }}
        run: dotnet test backend/TenonAdmin.slnx -c Release --no-build
