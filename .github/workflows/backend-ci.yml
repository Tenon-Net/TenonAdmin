name: backend-ci

# Backend CI (design §8): push / PR triggers build + test + template smoke test. Only runs when backend / templates are touched.
on:
  push:
    branches: [main, dev]
    paths: ['backend/**', 'templates/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'templates/**', '.github/workflows/backend-ci.yml']
  # Nightly full run: every DB leg runs the WHOLE suite, including the slow SqlServer full pass (40-60 min)
  # that push/PR deliberately skips (see the SqlServer filter in the Test step). schedule ignores `paths`,
  # so this always fires — the safety net that catches anything the PR-time SqlServer subset doesn't cover.
  schedule:
    - cron: '0 18 * * *'   # 02:00 Asia/Shanghai

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Database matrix (design §8 "at least SQLite + MySQL", plus SqlServer here). fail-fast=false: one red leg won't mask the others.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, sqlserver, postgres]

    # Service containers (started for every leg; legs that don't need them just ignore them — cheap, and avoids the complexity of conditional services).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # SqlServer: no health-cmd — the 2022 image doesn't ship sqlcmd by default, so the health probe would hang; readiness is instead guaranteed by the dedicated wait step below.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Tenon_Ci_2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
      # PostgreSQL: the official image ships pg_isready, so the health probe can use it directly — no extra wait step needed.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis: used by the **contract integration** half of RedisCacheTests (set/get, atomic increment, GETDEL).
      # It's gated by TENON_TEST_REDIS, which was never previously set — meaning this optional package's real
      # behavior had never once run in CI. The entire multi-replica escape hatch (force-logout, permission
      # invalidation, lockout counts across replicas) is built on top of it, so it must actually run, not just
      # be covered by offline DI-wiring tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.config has been cleared to nuget.org (removing the private-feed dependency), so external contributors can restore directly
      - name: Restore
        run: dotnet restore backend/TenonAdmin.slnx

      - name: Build
        run: dotnet build backend/TenonAdmin.slnx -c Release --no-restore

      # mysql leg only: the suite creates an isolated DB per test class (unique connection string → its own ADO.NET pool),
      # and idle pooled connections linger long after each test finishes. As the suite grew past ~70 test classes the
      # accumulated idle connections blew MySQL's default max_connections=151 ("Too many connections", 2026-07-16 red runs).
      # Two levers, both infra-side: raise the server ceiling here, and cap/reap pools via the connection string below.
      - name: Raise MySQL connection ceiling
        if: matrix.db == 'mysql'
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "SET GLOBAL max_connections = 1000;"

      # Wait until SqlServer accepts logins (sqlserver leg only). The port opens before logins are accepted,
      # so poll with a real login attempt instead — this doesn't depend on whether the DB image/host has sqlcmd
      # installed: borrow the official mssql-tools image + --network host to reach the host's :1433.
      - name: Wait for SQL Server ready
        if: matrix.db == 'sqlserver'
        run: |
          for i in $(seq 1 40); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
                 /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P 'Tenon_Ci_2026' -Q 'SELECT 1' -b >/dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            echo "waiting for SQL Server... ($i/40)"; sleep 3
          done
          echo "SQL Server did not become ready in time"; exit 1

      # Unit + integration tests (WebApplicationFactory). The DB is selected via env vars (see tests/TestDb.cs):
      #   sqlite leg → each test gets its own temp .db file; mysql/sqlserver legs → each test gets its own DB
      #   (derived from DbPath, auto-created/dropped). Includes the §8 replaceability six-piece suite +
      #   data-scope + auth/authorization/rate-limit regression tests.
      - name: Test (${{ matrix.db }})
        env:
          TENON_TEST_DBTYPE: ${{ matrix.db == 'mysql' && 'MySql' || matrix.db == 'sqlserver' && 'SqlServer' || matrix.db == 'postgres' && 'PostgreSQL' || 'Sqlite' }}
          # Maximum Pool Size / Connection Idle Timeout: hundreds of per-test pools accumulate idle connections
          # (MySqlConnector default keeps them 180s); cap each pool and reap fast so the steady state stays low.
          TENON_TEST_MYSQL: ${{ matrix.db == 'mysql' && 'Server=127.0.0.1;Port=3306;User ID=root;Password=root;AllowPublicKeyRetrieval=true;SSL Mode=None;Maximum Pool Size=10;Connection Idle Timeout=30;' || '' }}
          # The SqlServer connection string carries TrustServerCertificate/Encrypt=False: MDS 5.x encrypts by default and CI has no trusted certificate. The base string omits Database; TestDb appends it when creating the isolated DB.
          TENON_TEST_SQLSERVER: ${{ matrix.db == 'sqlserver' && 'Server=127.0.0.1;User ID=sa;Password=Tenon_Ci_2026;TrustServerCertificate=True;Encrypt=False;' || '' }}
          # The PostgreSQL base string omits Database (connects to the maintenance DB postgres to create the isolated DB; TestDb appends Database after creating it).
          TENON_TEST_POSTGRESQL: ${{ matrix.db == 'postgres' && 'Server=127.0.0.1;Port=5432;User ID=postgres;Password=postgres;' || '' }}
          # Gate switch for the Redis contract tests (runs on every leg: it's DB-independent, and running it a few extra times only costs a few seconds).
          TENON_TEST_REDIS: 127.0.0.1:6379
          # SqlServer full suite builds ~200 isolated databases, each replaying 23 CREATE TABLE whose per-statement
          # log flush dominates — 40-60 min on every push/PR (measured 2026-07-20; see CLAUDE.md "CI"). On push/PR the
          # SqlServer leg runs only the dialect-sensitive subset: the SqlServer-SPECIFIC surface (nvarchar Chinese,
          # CodeFirst_BigString long-text Chinese — bare ColumnDataType=text is non-Unicode on SqlServer and turns
          # Chinese into ???, caught by JobSchedulerTests orphan-reape ErrorText asserts / nightly #25;
          # boolean-predicate global filters, T-SQL DDL/bootstrap, Storageable seed SQL, and the scheduler's DateTime
          # equality CAS — datetime rounding is exactly where a silently-never-matching claim would hide). DB-agnostic business logic is
          # already covered by the full sqlite/mysql/postgres legs on the same PR; the full SqlServer suite runs nightly
          # (schedule) as the net. Rename a class out of this list and it silently drops to nightly-only — not a coverage
          # hole, just delayed signal. Other legs and the nightly run are unfiltered.
          #
          # WfPersistenceContractTests and WfNodeExecutionContractTests are the two Wf* classes in this list, and
          # deliberately so: every other workflow test is DB-agnostic business logic already exercised by the three
          # full legs, but that left the whole workflow package (including the M3a-1 reliable-execution tables —
          # wf_node_execution / wf_node_execution_attempt / wf_outbox — added after WfPersistenceContractTests was
          # written) with ZERO SqlServer coverage at PR time. WfPersistenceContractTests is the M2c four-database
          # persistence contract; WfNodeExecutionContractTests is its M3a-1 counterpart — unique-index enforcement,
          # long-text/Unicode round-trip, declared column widths, affected-rows semantics of the lease/fence CAS
          # updates, transaction-boundary atomicity across the three new tables, and the nullable-upgrade columns
          # Task 1 added to wf_history/wf_instance reading their DefaultValue on a non-empty table — so a
          # "four-database contract" that skips one of the four at PR time would be self-defeating. Cost is ~14 + ~13
          # isolated databases (each test builds its own), i.e. minutes, not the 40-60 of the full suite. If this leg
          # ever gets visibly slower, drop either entry and it falls back to nightly — do NOT add timeout-minutes instead.
          TEST_FILTER: ${{ (matrix.db == 'sqlserver' && github.event_name != 'schedule') && 'FullyQualifiedName~DataScopeTests|FullyQualifiedName~SoftDeleteAuditTests|FullyQualifiedName~OrgAuditEntityTests|FullyQualifiedName~SeedUpgradeTests|FullyQualifiedName~CodeFirstNullableUpgradeTests|FullyQualifiedName~RecycleBinTests|FullyQualifiedName~UserCrudTests|FullyQualifiedName~DictCrudTests|FullyQualifiedName~ReplaceabilityTests|FullyQualifiedName~ProductionBootstrapTests|FullyQualifiedName~JobElectionTests|FullyQualifiedName~JobClaimTests|FullyQualifiedName~JobSchedulerTests|FullyQualifiedName~WfPersistenceContractTests|FullyQualifiedName~WfNodeExecutionContractTests' || '' }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            echo "SqlServer push/PR leg: dialect-sensitive subset only (full SqlServer suite runs nightly)"
            dotnet test backend/TenonAdmin.slnx -c Release --no-build --filter "$TEST_FILTER"
          else
            dotnet test backend/TenonAdmin.slnx -c Release --no-build
          fi

  # The consumer's first command (dotnet new tenon-app → restore → build). Previously had zero automated
  # coverage — so the template kept referencing a package version whose tag was never published, and nobody
  # noticed: kernel tests were all green while a consumer's very first step failed. Runs in parallel with
  # build-test (it doesn't depend on the matrix); the grunt work is done by templates/smoke-test.ps1, the
  # same script used for local manual runs.
  template-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet new tenon-app must restore + build
        shell: pwsh
        run: templates/smoke-test.ps1

  # Nightly safety net has teeth only if someone sees it go red. The push/PR SqlServer leg runs a subset;
  # the full SqlServer suite runs only in the nightly (schedule) run, so a regression that lands outside the
  # subset surfaces there — but a scheduled run has no PR author watching it. This job turns a red nightly
  # into a tracked issue (deduped, so a multi-night outage bumps one issue rather than spamming a new one).
  # Only fires on scheduled runs: push/PR failures already sit in front of their author.
  nightly-alert:
    needs: [build-test, template-smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or bump the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --repo "$REPO" --color B60205 \
            --description "backend-ci nightly full run failed" 2>/dev/null || true
          body="Nightly \`backend-ci\` failed — this run includes the **full SqlServer suite** that push/PR deliberately skips (see the \`TEST_FILTER\` note in the workflow / CLAUDE.md CI section). A regression may live outside the push/PR SqlServer subset. Run: $RUN_URL"
          existing=$(gh issue list --repo "$REPO" --state open --label nightly-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Nightly backend-ci failed" --label nightly-failure --body "$body"
          fi
