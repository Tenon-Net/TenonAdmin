name: backend-release

# 打 tag(如 v0.0.1-preview)即打包 5 个 NuGet 包并推 nuget.org(设计 §T10)。
# 需在仓库 Secrets 配 NUGET_API_KEY;版本从 tag 名推导(去掉前缀 v)。
on:
  push:
    tags: ['v*']

jobs:
  pack-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack backend/TenonAdmin.slnx -c Release -o artifacts -p:Version=${{ steps.ver.outputs.version }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" -k "${{ secrets.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
