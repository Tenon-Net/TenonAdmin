name: backend-release

# Tagging on **main** (e.g. v0.1.0) packs the core NuGet packages + the `dotnet new` template package and pushes them to nuget.org (design §T10).
# Development happens on dev, releases go through main: merge dev into main first, then tag on main. A tag placed anywhere else is rejected by the gate below.
# The version is derived from the tag name (strip the leading v).
#
# Publishing credentials use nuget.org's **Trusted Publishing (OIDC)** instead of a long-lived API key:
#   - GitHub exchanges an id-token for a short-lived (~1 hour) nuget key that expires right after use — nothing to leak, nothing to rotate.
#   - Requires a Trusted Publishing policy on nuget.org (Owner=Tenon-Net, Repo=TenonAdmin,
#     Workflow=backend-release.yml), and the `user` in NuGet/login below must be the nuget.org account name that owns these packages.
#
# Pushing a package is **irreversible** (nuget.org can only unlist, not delete), so the gate must pass before the push:
# build → test → template smoke (run the consumer's very first command once). If any of the three is red, nothing ships.
on:
  push:
    tags: ['v*']

jobs:
  # The gate. Without it, both "the tests are red" and "the template won't restore" could ship straight to nuget.org.
  verify:
    runs-on: ubuntu-latest
    # RedisCacheTests' integration half **actively fails** (does not skip) in CI when Redis is missing (a silent skip = fake green, see the test's comment),
    # gated by TENON_TEST_REDIS. backend-ci's merge gate provides this service; the release gate runs the same suite, so it must provide it too,
    # otherwise those three tests go red here and the release is wrongly blocked. The SQLite leg is enough (backend-ci guards the multi-DB matrix), but Redis is DB-independent and must be supplied separately.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      # fetch-depth: 0 — the next step needs to tell whether the tag's commit is on main, and a shallow clone can't see the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release branch is main. Tags are branch-independent: tagging v0.1.0 on dev (or any branch) triggers this workflow all the same,
      # so code that never reached main and was never reviewed could be pushed straight to nuget.org — and a push is irreversible.
      # So this turns "releases must come from main" from a convention into a gate.
      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at commit $GITHUB_SHA, which is not on main. Merge dev into main first, then tag on main."
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build backend/TenonAdmin.slnx -c Release

      # The SQLite leg is enough: backend-ci guards the multi-DB matrix before merge; here we guard "can what we ship pass on its own".
      # TENON_TEST_REDIS points at the redis service above so RedisCacheTests' integration half actually runs (otherwise it goes red in CI).
      - name: Test
        env:
          TENON_TEST_REDIS: 127.0.0.1:6379
        run: dotnet test backend/TenonAdmin.slnx -c Release --no-build

      # The consumer's first command: dotnet new tenon-app → restore → build.
      # It packs at the tag version and makes the template reference that same version, so an error like "the template references a version the tag never published" is exposed right here.
      - name: Template smoke (dotnet new tenon-app must restore + build)
        shell: pwsh
        run: templates/smoke-test.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

  pack-push:
    needs: verify
    runs-on: ubuntu-latest
    # id-token: write — Trusted Publishing uses it to issue the OIDC token that is exchanged for the short-lived nuget key. Without this line, NuGet/login can't obtain a token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack backend/TenonAdmin.slnx -c Release -o artifacts -p:Version=${{ steps.ver.outputs.version }}

      # The template package lives outside backend/ (it doesn't inherit net10 / central version management), so it's packed separately; it lands in the same artifacts dir and is pushed together with the rest below.
      # Packing stamps this version into the template's TenonPkgVersion default (see StampTemplateVersion in TenonAdmin.Templates.csproj).
      - name: Pack templates
        run: dotnet pack templates/TenonAdmin.Templates.csproj -c Release -o artifacts -p:Version=${{ steps.ver.outputs.version }}

      # Exchange GitHub's OIDC token for a short-lived nuget key. `user` must be the nuget.org account name that has a Trusted Publishing policy
      # and owns (or is authorized to push) these packages. The returned key lands in the NUGET_API_KEY env var and is valid for this run only.
      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: hu53135580

      # The .snupkg symbol packages are pushed automatically alongside the .nupkg of the same name, so no separate glob is needed.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
