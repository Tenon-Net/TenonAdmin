name: contract-drift

# Regenerate both frontend contracts from a clean Development MinimalHost and fail if HEAD is stale.
on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'web/src/api/schema.d.ts'
      - 'web-react/src/api/schema.d.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web-react/package.json'
      - 'web-react/package-lock.json'
      - '.github/workflows/contract-drift.yml'
      - 'scripts/check-contract-drift.mjs'
      - 'scripts/gen-api.mjs'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/src/api/schema.d.ts'
      - 'web-react/src/api/schema.d.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web-react/package.json'
      - 'web-react/package-lock.json'
      - '.github/workflows/contract-drift.yml'
      - 'scripts/check-contract-drift.mjs'
      - 'scripts/gen-api.mjs'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-react/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install web-react deps
        working-directory: web-react
        run: npm ci

      - name: Check contract drift (boot MinimalHost, regenerate, diff)
        run: node scripts/check-contract-drift.mjs
