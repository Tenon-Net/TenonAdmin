# Smoke test for the container deliverable (the acceptance line for dev-plan T-D4 / T-D3).
#
# Two jobs:
#   single —— the image can come up: production environment + empty DB + named volume + non-root user all hold
#             at once, and it can still create tables, seed data, and issue tokens.
#   multi  —— **multi-replica guarantees**: force-logout takes effect across replicas immediately, the lockout
#             threshold doesn't double, the rate-limit threshold is cluster-wide, the two replicas get
#             different machine IDs, and the real client IP is recovered behind the reverse proxy. These only
#             surface when two replicas are online at once — running a single replica ten thousand times would
#             never reveal them.
name: docker-smoke

on:
  push:
    branches: [main, dev]
    # GitHub Actions doesn't support YAML anchors, so this list has to be duplicated in both places.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.scale.yml'
      - 'web/Dockerfile'
      - 'web/Caddyfile'
      - 'web/nginx.conf'
      - 'scripts/smoke-multi-replica.sh'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/docker-smoke.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.scale.yml'
      - 'web/Dockerfile'
      - 'web/Caddyfile'
      - 'web/nginx.conf'
      - 'scripts/smoke-multi-replica.sh'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/docker-smoke.yml'

jobs:
  single:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TENON_ADMIN_PASSWORD: Smoke@123456
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the backend to report ready
        # /health/ready probes dependencies (DB + cache), not just "is the process alive". It turning green
        # means table creation + seeding have both finished. Poll from the host rather than adding a
        # HEALTHCHECK to the image: the aspnet runtime image has neither curl nor wget.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/health/ready > /dev/null; then
              echo "backend ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::backend never became ready"
          docker compose logs app
          exit 1

      - name: Log in as the seeded super admin
        # Actually issue a token: this proves at once that the DB was created, seed data was written, and the
        # JWT key resolves successfully inside the container.
        run: |
          code=$(curl -s -X POST http://localhost:8081/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"account\":\"superAdmin\",\"password\":\"${TENON_ADMIN_PASSWORD}\"}" \
            | tee /tmp/login.json | jq -r '.code')
          cat /tmp/login.json
          if [ "$code" != "0" ]; then echo "::error::login failed (code=$code)"; docker compose logs app; exit 1; fi
          token=$(jq -r '.data.accessToken' /tmp/login.json)
          if [ -z "$token" ] || [ "$token" = "null" ]; then echo "::error::no access token"; exit 1; fi

      - name: Frontend is served and proxies /api
        run: |
          curl -sf http://localhost:8080/ | grep -qi '<div id="app"' \
            || { echo "::error::SPA index not served"; docker compose logs web; exit 1; }
          # Hit a protected endpoint through Caddy: 401 = the reverse proxy works (and default-deny still
          # holds). This also pins down the Caddyfile's handle block: with a flat layout, try_files would
          # race ahead of reverse_proxy and rewrite /api/... to /index.html, so the API request would get
          # back an HTML page (status 200) instead of 401.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/ping)
          [ "$status" = "401" ] || { echo "::error::/api proxy returned $status, expected 401"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TENON_ADMIN_PASSWORD: Smoke@123456
    steps:
      - uses: actions/checkout@v4

      - name: Build and start two replicas behind Caddy
        # Two **explicit** app services (each with a different WorkerId), not --scale: compose can't give
        # --scale-produced replicas their own distinct environment variables, and the machine ID must
        # specifically differ per replica — the same ID means colliding primary keys.
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build

      - name: Prove the multi-replica guarantees
        # Each assertion targets one specific bug fixed in this batch; the script itself prints "what it
        # looked like before the fix".
        run: bash scripts/smoke-multi-replica.sh http://localhost:8080

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml down -v
