# 文档门面站(site/,VitePress)构建并发布到 GitHub Pages。
# 发布模型:GitHub Actions 直接部署,无 gh-pages 分支。
# 前置:仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  # PR 只跑闸门与构建，不部署。贡献指南要求 PR 对准 dev，所以两个分支都收。
  pull_request:
    branches: [main, dev]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署,取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 散文闸门。规矩的真相源是 skills/write-docs.md，脚本只实现其中机器判得准的部分。
  # 先跑 selftest：闸门自己坏掉时会静默放行一切，那比没有闸门更糟——
  # 你跑一遍绿灯，带着违规发车。
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint:prose:selftest
      - run: npm run lint:prose

  build:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
