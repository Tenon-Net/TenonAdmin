name: web-ci

# Frontend CI (dev-plan "follow-up work"): push / PR triggers lint + unit test + build (build includes vue-tsc type checking). Only runs when web is touched.
on:
  push:
    branches: [main, dev]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      # build = vue-tsc --noEmit && vite build, type checking is already included, so typecheck isn't run separately
      - name: Build
        run: npm run build
