name: web-ci

# 前端 CI(dev-plan「后续刀」):push / PR 触发 lint + build(build 内含 vue-tsc 类型检查)。仅在改到 web 时跑。
on:
  push:
    branches: [main, dev]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # build = vue-tsc --noEmit && vite build,类型检查已包含在内,不单跑 typecheck
      - name: Build
        run: npm run build
