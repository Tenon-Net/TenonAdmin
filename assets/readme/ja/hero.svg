      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="50%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#121420"/>
    </linearGradient>
    <radialGradient id="glow-primary" cx="0.18" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#646CFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#646CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-accent" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#8B91FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B91FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
