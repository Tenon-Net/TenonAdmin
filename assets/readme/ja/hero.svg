    <line x1="290" y1="216" x2="290" y2="232" stroke="#646CFF" stroke-width="1" opacity="0.15"/><circle cx="290" cy="232" r="2" fill="#646CFF" opacity="0.3"/>

    <rect x="120" y="238" width="340" height="44" rx="10" fill="#141620" stroke="#2A2D3E" stroke-width="0.5"/>
    <circle cx="146" cy="260" r="4" fill="#646CFF" opacity="0.5"/>
    <text x="162" y="265" fill="#A6ABB5" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13">.SqlSugar</text>
    <text x="434" y="265" fill="#4E5969" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">ORM · リポジトリ · CodeFirst</text>

    <line x1="290" y1="282" x2="290" y2="298" stroke="#646CFF" stroke-width="1" opacity="0.1"/><circle cx="290" cy="298" r="2" fill="#646CFF" opacity="0.25"/>

    <rect x="120" y="304" width="340" height="44" rx="10" fill="#141620" stroke="#2A2D3E" stroke-width="0.5"/>
    <circle cx="146" cy="326" r="4" fill="#646CFF" opacity="0.35"/>
