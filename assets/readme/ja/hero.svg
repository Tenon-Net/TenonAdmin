    <text x="18" y="28" fill="#4E5969" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13">$</text>
    <text x="36" y="28" fill="#A6ABB5" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13">dotnet add package </text>
    <text x="236" y="28" fill="#8B91FF" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13" font-weight="600">TenonAdmin</text>
