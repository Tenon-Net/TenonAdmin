    <circle cx="60" cy="120" r="1" fill="#E8EAED"/><circle cx="120" cy="120" r="1" fill="#E8EAED"/><circle cx="180" cy="120" r="1" fill="#E8EAED"/><circle cx="240" cy="120" r="1" fill="#E8EAED"/><circle cx="300" cy="120" r="1" fill="#E8EAED"/><circle cx="360" cy="120" r="1" fill="#E8EAED"/>
