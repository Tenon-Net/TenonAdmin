  <text x="64" y="198" fill="#A6ABB5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" font-weight="400">完全で拡張可能な RBAC 権限管理を組み込めます。</text>

