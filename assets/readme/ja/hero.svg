    <text x="47" y="20" fill="#8B91FF" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500">.NET 10</text>
    <rect x="104" width="78" height="30" rx="8" fill="url(#tag-bg)" stroke="#2A2D3E" stroke-width="0.5"/>
    <text x="143" y="20" fill="#8B91FF" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500">Vue 3</text>
    <rect x="192" width="96" height="30" rx="8" fill="url(#tag-bg)" stroke="#2A2D3E" stroke-width="0.5"/>
    <text x="240" y="20" fill="#8B91FF" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500">Naive UI</text>
    <rect x="298" width="100" height="30" rx="8" fill="url(#tag-bg)" stroke="#2A2D3E" stroke-width="0.5"/>
    <text x="348" y="20" fill="#8B91FF" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500">SqlSugar</text>
