# Two-replica overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
#
# This isn't a "demo of how to scale out" —— it's the **acceptance test site for this batch's
# multi-replica guarantees**. Every fix in batch six only surfaces when two replicas are online at the
# same time; running a single replica ten thousand times would never reveal it:
#   · rate-limit counting goes through Redis  → the threshold is "N times across the whole cluster", not
#     "N times per replica"
#   · session cache goes through Redis  → a forced logout takes effect **immediately** on both replicas
#     (with an in-process cache, replica B would keep allowing the session for days)
#   · login failure counting goes through Redis → the lockout threshold doesn't double
#   · each replica has a different WorkerId → IDs generated in the same millisecond don't collide on the
#     primary key
#   · X-Forwarded-For    → both replicas rate-limit by the real client IP, instead of both seeing Caddy's
#     single IP
#
# **Why two explicit app services instead of `--scale app=2`**: compose can't give replicas spun up via
# `--scale` their own distinct environment variables, and WorkerId specifically must differ per replica ——
# the same number means a primary-key collision. On the k8s side this is done via StatefulSet's pod
# ordinal injection (app-0 / app-1), documented in docs/deployment.md.

services:
  # The second replica. Only overrides the two things that must differ: the worker ID, and no longer
  # mapping a port externally (traffic comes in through Caddy).
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      # **Serialized startup**: on cold start, CodeFirst table creation + seed writing is a "check then
      # insert" that isn't atomic —— if both replicas boot for the first time simultaneously, one of them
      # would crash on a unique-key collision. Waiting for the first replica to become healthy (tables and
      # seed data both in place) before starting the second sidesteps this with zero code changes.
      # The k8s-side equivalent is an init job / migration job.
      app:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TenonAdmin__Jwt__SecretKey: ${TENON_JWT_SECRET:-tenon-compose-demo-signing-key-please-change-me}
      TenonAdmin__Database__DbType: MySql
      TenonAdmin__Database__ConnectionString: Server=db;Port=3306;Database=tenon;User ID=root;Password=${TENON_DB_PASSWORD:-tenon-compose-demo};AllowPublicKeyRetrieval=true;SSL Mode=None;
      # Tables and seed data are already created by the first replica, so this one doesn't need to create
      # them again (and shouldn't race it either)
      TenonAdmin__Database__EnableCodeFirstInProduction: "false"
      TenonAdmin__Upload__RootPath: /data/upload
      TenonAdmin__Seed__AdminPassword: ${TENON_ADMIN_PASSWORD:-Tenon@123456}
      TenonAdmin__Cache__Provider: Redis
      TenonAdmin__Cache__RedisConnectionString: redis:6379
      TenonAdmin__Id__WorkerId: "1"          # ← differs from app's 0, this is the whole reason this file exists
      TenonAdmin__Api__ForwardedHeaders__Enabled: "true"
      TenonAdmin__Api__ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    volumes:
      - app-data:/app/data
      - upload-data:/data/upload   # uploaded files must be on a **shared volume**: otherwise a file uploaded
                                    # via A would 404 on B, and chunked uploads would fail with ChunkMissing

  app:
    healthcheck:
      # app2 relies on this to know when to start (see the serialized startup note above). The aspnet
      # runtime image has no curl/wget, and beyond the .NET SDK the only executable readily available is
      # dotnet itself. Running a tiny probe with it isn't worth it —— so instead we go with the cheapest
      # option available outside Caddy: a TCP port probe for the health check.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  web:
    depends_on:
      - app
      - app2
    environment:
      # Caddy round-robins across multiple space-separated upstreams → it is the load balancer for this
      # acceptance setup
      TENON_UPSTREAMS: "app:8080 app2:8080"
