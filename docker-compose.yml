# A single `docker compose up` brings up the whole stack: MySQL + Redis + backend (MinimalHost) + frontend
# (Caddy serving the SPA, reverse-proxying /api).
#
# For a real test of the multi-replica guarantees with two replicas → see docker-compose.scale.yml.
#
# This is also a **live test of the production first-boot path**. The app is deliberately run with
# ASPNETCORE_ENVIRONMENT=Production, so all of the following must hold simultaneously for it to come up ——
# missing any one of them fails with a readable error, and that's exactly what's being verified:
#   · Jwt:SecretKey must be set explicitly (production doesn't allow the auto-generated dev key, otherwise
#     each replica signs with its own key → random 401s)
#   · table creation on an empty database must be explicitly allowed on first boot (production doesn't
#     auto-ALTER the database by default)
#   · the upload root must sit outside wwwroot (otherwise adding UseStaticFiles() to this image would
#     serve the upload directory anonymously)
#
# The demo secrets/passwords are written into the default values below —— **for a real production
# deployment, inject them from the environment** (compose reads a .env file from the same directory).
name: tenon-admin

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${TENON_DB_PASSWORD:-tenon-compose-demo}
      MYSQL_DATABASE: tenon
    healthcheck:
      # app relies on this to know when it can start connecting to the database (depends_on: service_healthy),
      # otherwise first boot would always run into "database isn't up yet"
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TENON_DB_PASSWORD:-tenon-compose-demo}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # All config goes through double-underscore environment variables (docs/deployment.md §0); no
      # secrets are baked into the image
      TenonAdmin__Jwt__SecretKey: ${TENON_JWT_SECRET:-tenon-compose-demo-signing-key-please-change-me}
      TenonAdmin__Database__DbType: MySql
      TenonAdmin__Database__ConnectionString: Server=db;Port=3306;Database=tenon;User ID=root;Password=${TENON_DB_PASSWORD:-tenon-compose-demo};AllowPublicKeyRetrieval=true;SSL Mode=None;
      # Empty database first boot: let the app create its own tables + write seed data. When the production
      # database is maintained by a DBA, switch this to false and create the tables yourself before starting.
      TenonAdmin__Database__EnableCodeFirstInProduction: "true"
      # Upload root: must be outside wwwroot (see the file header comment), and on a separate volume from /app/data
      TenonAdmin__Upload__RootPath: /data/upload
      # The super-admin password for first boot. If not given, one is randomly generated and printed to
      # the console (see docker compose logs app)
      TenonAdmin__Seed__AdminPassword: ${TENON_ADMIN_PASSWORD:-Tenon@123456}

      # Caching goes through Redis. Under multiple replicas this isn't an optional optimization but a
      # **prerequisite**: an in-process cache means a forced logout / permission revocation on replica A
      # never reaches replica B, and the session cache TTL matches the refresh token's lifetime (days) ——
      # a forced logout would fail to take effect on half the requests for days.
      # It's worth it even with a single replica: the cache survives restarts.
      TenonAdmin__Cache__Provider: Redis
      TenonAdmin__Cache__RedisConnectionString: redis:6379

      # Snowflake worker ID: **must differ per instance** (0-63) when scaling horizontally, otherwise IDs
      # generated in the same millisecond collide on the primary key.
      # If Redis is configured but this value isn't set explicitly → the kernel refuses to start (turning
      # a silent primary-key collision into a readable startup error).
      # compose can't give replicas spun up via `--scale` their own distinct values —— to run multiple
      # replicas use docker-compose.scale.yml's **explicit multiple app services** approach instead, each
      # with its own WorkerId.
      TenonAdmin__Id__WorkerId: "0"

      # Reverse-proxy forwarded headers: Caddy (the web service) sits in front, and without parsing
      # X-Forwarded-For the backend would always see the proxy container's single IP —— every user would
      # share one rate-limit bucket (one person hammering login could lock everyone out), and login logs
      # would record the proxy's IP too. What's trusted is a **network range** (the docker bridge network),
      # so this still holds if the proxy is swapped for nginx/Traefik.
      TenonAdmin__Api__ForwardedHeaders__Enabled: "true"
      TenonAdmin__Api__ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    ports:
      # Direct backend access, **bound to loopback only** —— for debugging; normal access goes through the
      # frontend (Caddy already reverse-proxies /api and /health).
      #
      # Why it must bind to 127.0.0.1: ForwardedHeaders is enabled below and trusts the docker bridge
      # network, and a request coming in through the port mapping shows up inside the container with the
      # gateway as its source address (172.x.0.1) —— which is also in the trusted range. So **anyone who
      # can reach this port directly can forge X-Forwarded-For**: switching the fake IP switches the
      # rate-limit bucket (completely bypassing rate limiting), and can also pin failed brute-force
      # attempts on someone else. Binding 0.0.0.0 would open this capability to the whole LAN. Binding
      # loopback restricts it to the host machine itself.
      # In production, consider simply removing this port mapping and only allowing access through the
      # reverse proxy.
      - "127.0.0.1:${TENON_API_PORT:-8081}:8080"
    volumes:
      - app-data:/app/data       # SQLite (unused in this example) + JWT dev signing key
      - upload-data:/data/upload # uploaded files

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - app
    ports:
      - "${TENON_WEB_PORT:-8080}:80"

# Named volumes, not bind mounts: a named volume's first mount carries over ownership from the image
# directory, which is the only way the non-root user inside the container can write to it.
# A bind mount would override ownership with the host's, leaving the non-root user unable to write ——
# the most common pitfall when containerizing SQLite/upload directories.
volumes:
  db-data:
  redis-data:
  app-data:
  upload-data:
