# 一条 `docker compose up` 即可启动完整环境：MySQL + Redis + 后端（MinimalHost）+ 前端
# （Caddy 托管 SPA 并反向代理 /api）。
#
# 如需测试双副本的多副本保证 → 参见 docker-compose.scale.yml。
#
# 这同时也是**生产首次启动路径的实测**。应用刻意使用 ASPNETCORE_ENVIRONMENT=Production 运行，
# 因此以下条件必须同时满足才能启动——缺少任何一个都会报可读的错误，这正是要验证的：
#   · Jwt:SecretKey 必须显式设置（生产环境不允许自动生成的开发密钥，否则每个副本用自己的密钥签名 → 随机 401）
#   · 空数据库首次启动时必须显式允许建表（生产环境默认不自动 ALTER 数据库）
#   · 上传根目录必须在 wwwroot 外部（否则添加 UseStaticFiles() 会导致上传目录被匿名访问）
#
# 演示用的密钥/密码写在下面的默认值中——**正式生产部署时，请通过环境变量注入**
# （compose 会从同目录的 .env 文件读取）。
name: tenon-admin

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${TENON_DB_PASSWORD:-tenon-compose-demo}
      MYSQL_DATABASE: tenon
    healthcheck:
      # 应用依赖此检查判断数据库是否就绪（depends_on: service_healthy），
      # 否则首次启动会遇到"数据库未就绪"的错误
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TENON_DB_PASSWORD:-tenon-compose-demo}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 时区：容器默认 UTC、宿主机常是 +8。定时任务全模块用**服务器本地时间**，参与调度的所有进程
      # 必须同一时区,否则任务会在错误的时刻执行(领取 CAS 仍保证不双发,但时刻是错的)。
      # 见 docs/scheduling-ledger.md §10.4。
      TZ: ${TENON_TZ:-Asia/Shanghai}
      # 所有配置通过双下划线环境变量传入（docs/deployment.md §0）；镜像中不烘焙任何密钥
      TenonAdmin__Jwt__SecretKey: ${TENON_JWT_SECRET:-tenon-compose-demo-signing-key-please-change-me}
      TenonAdmin__Database__DbType: MySql
      TenonAdmin__Database__ConnectionString: Server=db;Port=3306;Database=tenon;User ID=root;Password=${TENON_DB_PASSWORD:-tenon-compose-demo};AllowPublicKeyRetrieval=true;SSL Mode=None;
      # 空数据库首次启动：允许应用自动建表并写入种子数据。当生产数据库由 DBA 维护时，
      # 将此项设为 false 并在启动前手动建表。
      TenonAdmin__Database__EnableCodeFirstInProduction: "true"
      # 上传根目录：必须在 wwwroot 外部（见文件头注释），且使用独立于 /app/data 的卷
      TenonAdmin__Upload__RootPath: /data/upload
      # 首次启动的超级管理员密码。如未指定，将随机生成并输出到控制台
      # （通过 docker compose logs app 查看）
      TenonAdmin__Seed__AdminPassword: ${TENON_ADMIN_PASSWORD:-Tenon@123456}

      # 缓存走 Redis。多副本场景下这不是可选的优化，而是**前提条件**：进程内缓存意味着
      # 在副本 A 上的强制登出/权限撤销永远不会传达到副本 B，而会话缓存的 TTL 与刷新令牌的
      # 生命周期一致（以天计）——强制登出会在数天内对半数请求无效。
      # 即使只有单副本也值得用：缓存在重启后依然保留。
      TenonAdmin__Cache__Provider: Redis
      TenonAdmin__Cache__RedisConnectionString: redis:6379

      # 雪花算法 WorkerId：水平扩展时**每个实例必须不同**（0-63），否则同一毫秒内生成的 ID
      # 会在主键上冲突。
      # 如果配置了 Redis 但未显式设置此值 → 内核拒绝启动（将静默的主键冲突变为可读的启动错误）。
      # compose 无法为通过 `--scale` 启动的副本分配各自独立的值——要运行多副本，
      # 请使用 docker-compose.scale.yml 的**显式多 app 服务**方式，每个服务有自己的 WorkerId。
      TenonAdmin__Id__WorkerId: "0"

      # 反向代理转发头：Caddy（web 服务）位于前端，如果不解析 X-Forwarded-For，后端将始终
      # 看到代理容器的单一 IP——所有用户会共享同一个限流桶（一个人暴力登录可能锁定所有人），
      # 登录日志也会记录代理的 IP。信任的是**网段**（Docker 桥接网络），
      # 因此即使将代理换成 nginx/Traefik 仍然有效。
      TenonAdmin__Api__ForwardedHeaders__Enabled: "true"
      TenonAdmin__Api__ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    ports:
      # 后端直接访问端口，**仅绑定到回环地址**——用于调试；正常访问通过前端
      # （Caddy 已反向代理 /api 和 /health）。
      #
      # 为什么必须绑定 127.0.0.1：下面启用了 ForwardedHeaders 并信任 Docker 桥接网段，
      # 而通过端口映射进来的请求在容器内的源地址是网关地址（172.x.0.1）——也在信任范围内。
      # 因此**任何能直接访问此端口的人都可以伪造 X-Forwarded-For**：切换伪造 IP 就能切换
      # 限流桶（完全绕过限流），还能把暴力破解的失败次数嫁祸给别人。绑定 0.0.0.0 会把这个
      # 能力暴露给整个局域网。绑定回环地址则限制在宿主机本身。
      # 生产环境中，建议直接移除此端口映射，仅允许通过反向代理访问。
      - "127.0.0.1:${TENON_API_PORT:-8081}:8080"
    volumes:
      - app-data:/app/data       # SQLite（本例未使用）+ JWT 开发签名密钥
      - upload-data:/data/upload # 上传文件

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - app
    ports:
      - "${TENON_WEB_PORT:-8080}:80"

  # React 模板（web-react）。与 Vue 版 web **各自自包含、零共享**：构建上下文是 web-react/ 自己
  # （不再需要仓库根，这正是自包含买到的），故这里不写 dockerfile 字段、直接 context: ./web-react。
  # 想同时起两套前端对照:`docker compose --profile react up`,web-react 与 web 各占一口、都反代到同一个 app。
  #
  # **profiles: ["react"] 是刻意的解耦**:默认 `docker compose up`(docker-smoke.yml 那条容器验收就是它)
  # **不构建/不启动** web-react —— 否则 web-react 一处构建问题会拖垮与它无关的 backend/web 容器 smoke,
  # 那正是零共享要避免的跨模板耦合。web-react 自己的构建由 web-react-ci.yml 独立把关。
  web-react:
    profiles: ["react"]
    build:
      context: ./web-react
    depends_on:
      - app
    ports:
      - "${TENON_WEB_REACT_PORT:-8082}:80"

# 命名卷而非绑定挂载：命名卷首次挂载时会继承镜像目录中的所有权，
# 这是容器内非 root 用户能写入的唯一方式。
# 绑定挂载会用宿主机的所有权覆盖，导致非 root 用户无法写入——
# 这是容器化 SQLite/上传目录时最常见的坑。
volumes:
  db-data:
  redis-data:
  app-data:
  upload-data:
