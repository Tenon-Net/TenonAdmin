# 前端静态托管 + /api 反代(docs/deployment.md 路线 B 的那段配置,现在是一个真文件而不是 markdown 里的代码块)。
# 浏览器只看到一个源,因此**不需要 CORS**(后端默认 deny-all,不必为此开口子)。
server {
    listen 80;

    # 上传大小上限要 ≥ TenonAdmin:Upload:MaxSizeMb(默认 20MB)。
    # nginx 默认只有 1m —— 不改的话传大文件拿到的是 nginx 的 413,而不是内核那条能读懂的错误码。
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 history 路由:未命中静态文件就交给 SPA 自己解析(深链刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 探针:编排层/负载均衡直接探这里,不必知道后端在哪
    location /health {
        proxy_pass http://app:8080;
        access_log off;
    }
}
