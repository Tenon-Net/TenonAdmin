# 前端静态托管 + /api 反代 —— **备选路线**。默认交付物现在是 web/Caddyfile(上域名即自动签证书);
# 这份留给已经有 nginx 网关、照抄进去更省事的人。两条路线在 docs/deployment.md 并列。
# 换回 nginx:把 web/Dockerfile 的运行阶段改成 nginx:alpine + 这份配置即可。
#
# 浏览器只看到一个源,因此**不需要 CORS**(后端默认 deny-all,不必为此开口子)。
# 注意:光在这里写 X-Forwarded-For 没用 —— 后端要采信它还须配 TenonAdmin:Api:ForwardedHeaders
# (受信网段),否则限流按 IP 分区形同虚设(全体用户共用一个桶),登录日志记的也是代理 IP。
server {
    listen 80;

    # 上传大小上限要 ≥ TenonAdmin:Upload:MaxSizeMb(默认 20MB)。
    # nginx 默认只有 1m —— 不改的话传大文件拿到的是 nginx 的 413,而不是内核那条能读懂的错误码。
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 history 路由:未命中静态文件就交给 SPA 自己解析(深链刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR 实时通知 Hub(强制下线、未读刷新):WebSocket 升级必须显式转发 Upgrade/Connection,
    # 否则握手退化成普通 HTTP、连不上,实时通知静默退回 30s 轮询。(Caddy 那份自动处理,无需此段。)
    location /hub/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 探针:编排层/负载均衡直接探这里,不必知道后端在哪
    location /health {
        proxy_pass http://app:8080;
        access_log off;
    }
}
